<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Keys - Context Mixer</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body hx-headers='{"Accept": "text/html"}'>
  <header>
    <button class="menu-toggle" aria-label="Menu">☰</button>
    <a class="brand" href="/">Mixer</a>
    <nav>
      <a href="/">Docs</a>
      <a href="/keys.html" class="active">Keys</a>
      <a href="/inbox.html">Inbox</a>
      <a href="/files.html">Files</a>
    </nav>
    <div class="spacer"></div>
    <div id="user-info" class="user-info"></div>
  </header>

  <main class="main-content">
    <div style="max-width: 800px; margin: 0 auto">
      <h1>API Key Management</h1>
      <p class="muted" style="margin-bottom: var(--space-6)">Issue and manage keys for AI agents and external services.</p>

      <div class="doc-meta-card" style="margin-bottom: var(--space-7)">
        <h3>Issue New Key</h3>
        <div class="form-row" style="margin-bottom: var(--space-4)">
          <input type="text" id="key-name" name="name" class="input grow" placeholder="Key name (e.g. claude-code)">
          <label class="muted" style="display:flex; align-items:center; gap:4px; font-size:var(--text-xs)">
            <input type="checkbox" name="scopes" value="read" checked> READ
          </label>
          <label class="muted" style="display:flex; align-items:center; gap:4px; font-size:var(--text-xs)">
            <input type="checkbox" name="scopes" value="write"> WRITE
          </label>
          <button class="btn-primary" hx-post="/api-keys" hx-include="#key-name,[name='scopes']" hx-target="#created-key-section">Generate</button>
        </div>
        <div id="created-key-section" style="display:none">
        </div>
      </div>

      <h2 class="sidebar-title">Existing Keys</h2>
      <div id="keys-list" hx-get="/api-keys" hx-trigger="load">
        <p class="muted">Loading...</p>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    function copyKey(key) {
      navigator.clipboard.writeText(key).then(() => {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = 'Key copied to clipboard';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      });
    }
  </script>
</body>
</html>
