<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Keys - Context Mixer</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/htmx.min.js"></script>
</head>
<body hx-headers='{"Accept": "text/html"}'>
  <header>
    <a class="brand" href="/app.html">Context Mixer</a>
    <span class="spacer"></span>
    <nav>
      <a href="/keys.html" style="color:var(--accent)">キー</a>
      <a href="/inbox.html">受信箱</a>
      <a href="/files.html">ファイル</a>
      <a href="/images.html">画像</a>
    </nav>
    <button id="signout" class="btn-quiet">サインアウト</button>
  </header>

  <main class="main-content">
    <div style="max-width: 800px; margin: 0 auto">
      <h1>API Key Management</h1>
      <p class="muted" style="margin-bottom: var(--space-6)">Issue and manage keys for AI agents and external services.</p>

      <div class="doc-meta-card" style="margin-bottom: var(--space-7)">
        <h3>Issue New Key</h3>
        <div class="form-row" style="margin-bottom: var(--space-4)">
          <input type="text" id="key-name" name="name" class="input grow" placeholder="Key name (e.g. claude-code)">
          <label class="muted" style="display:flex; align-items:center; gap:4px; font-size:var(--text-xs)">
            <input type="checkbox" name="scopes" value="read" checked> READ
          </label>
          <label class="muted" style="display:flex; align-items:center; gap:4px; font-size:var(--text-xs)">
            <input type="checkbox" name="scopes" value="write"> WRITE
          </label>
          <button class="btn-primary" hx-post="/api-keys" hx-include="#key-name,[name='scopes']" hx-target="#created-key-section">Generate</button>
        </div>
        <div id="created-key-section">
        </div>
      </div>

      <h2 class="sidebar-title">Existing Keys</h2>
      <div id="keys-list" hx-get="/api-keys" hx-trigger="auth-ready from:body">
        <div class="doc-loading"><span class="spinner" aria-label="読み込み中"></span></div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    function copyKey(key) {
      navigator.clipboard.writeText(key).then(() => {
        const line = document.createElement('div');
        line.className = 'sysline';
        line.innerHTML = '<span class="ok">✓</span> キーをコピーしました';
        document.body.appendChild(line);
        setTimeout(() => line.remove(), 3000);
      });
    }
  </script>
</body>
</html>
