<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Context Mixer</title>
  <script>
    // 旧URL互換: /doc.html?id=xxx → /?doc=xxx
    const id = new URLSearchParams(location.search).get('id')
    location.replace(id ? `/?doc=${encodeURIComponent(id)}` : '/')
  </script>
</head>
<body></body>
</html>
