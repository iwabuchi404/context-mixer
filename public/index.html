<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Mixer</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/vue@3.5/dist/vue.global.prod.js"></script>
</head>
<body>
  <header></header>
  <main id="app" v-cloak>
    <p v-if="error" class="error">{{ error }}</p>

    <section>
      <div class="row">
        <h2 style="margin:0.4rem 0">Collections</h2>
        <span class="spacer" style="flex:1"></span>
        <input v-model="newCollectionName" type="text" placeholder="新しいコレクション名"
               style="max-width:14rem" @keyup.enter="createCollection">
        <button class="primary" @click="createCollection" :disabled="!newCollectionName.trim()">作成</button>
      </div>
      <ul class="plain">
        <li v-for="col in flatCollections" :key="col.id"
            :style="{ paddingLeft: (col.depth * 1.2 + 0.2) + 'rem' }">
          <a href="#" @click.prevent="selectCollection(col)"
             :style="{ fontWeight: selected?.id === col.id ? 700 : 400 }">{{ col.name }}</a>
          <span v-if="col.is_system" class="tag">system</span>
        </li>
        <li v-if="flatCollections.length === 0" class="muted">コレクションがありません。まず1つ作成してください。</li>
      </ul>
    </section>

    <section v-if="selected">
      <div class="row">
        <h2 style="margin:0.4rem 0">{{ selected.name }} のドキュメント</h2>
        <span class="spacer" style="flex:1"></span>
        <input v-model="newDocTitle" type="text" placeholder="新しいドキュメントのタイトル"
               style="max-width:16rem" @keyup.enter="createDoc">
        <button class="primary" @click="createDoc" :disabled="!newDocTitle.trim()">作成</button>
      </div>
      <ul class="plain">
        <li v-for="doc in docs" :key="doc.id">
          <a :href="'/doc?id=' + doc.id">{{ doc.title }}</a>
          <span class="tag" v-if="doc.priority !== 'normal'">{{ doc.priority }}</span>
          <div class="muted">{{ new Date(doc.updated_at).toLocaleString() }}</div>
        </li>
        <li v-if="docs.length === 0" class="muted">ドキュメントがありません。</li>
      </ul>
      <button v-if="nextCursor" @click="loadMoreDocs">さらに読み込む</button>
    </section>

    <section>
      <h2>検索</h2>
      <div class="row">
        <input v-model="query" type="text" class="grow" placeholder="キーワード検索" @keyup.enter="search">
        <button @click="search" :disabled="!query.trim()">検索</button>
      </div>
      <ul class="plain">
        <li v-for="hit in hits" :key="hit.id">
          <a :href="'/doc?id=' + hit.id">{{ hit.title }}</a>
          <div class="muted" style="white-space:pre-wrap">{{ hit.snippet }}</div>
        </li>
      </ul>
    </section>
  </main>

  <script type="module">
    import { requireAuth, api, renderHeader } from '/app.js'

    const clerk = await requireAuth()
    renderHeader(clerk)

    Vue.createApp({
      data: () => ({
        collections: [],
        selected: null,
        docs: [],
        nextCursor: null,
        hits: [],
        query: '',
        newCollectionName: '',
        newDocTitle: '',
        error: '',
      }),
      computed: {
        flatCollections() {
          const out = []
          const walk = (nodes, depth) => {
            for (const n of nodes ?? []) {
              out.push({ ...n, depth })
              walk(n.children, depth + 1)
            }
          }
          walk(this.collections, 0)
          return out
        },
      },
      methods: {
        async run(fn) {
          this.error = ''
          try { await fn() } catch (e) { this.error = e.message }
        },
        async reloadCollections() {
          this.collections = await api('/collections')
        },
        async selectCollection(col) {
          await this.run(async () => {
            this.selected = col
            const page = await api(`/docs?collection=${encodeURIComponent(col.id)}`)
            this.docs = page.data
            this.nextCursor = page.next_cursor
          })
        },
        async loadMoreDocs() {
          await this.run(async () => {
            const page = await api(`/docs?collection=${encodeURIComponent(this.selected.id)}&cursor=${encodeURIComponent(this.nextCursor)}`)
            this.docs.push(...page.data)
            this.nextCursor = page.next_cursor
          })
        },
        async createCollection() {
          await this.run(async () => {
            await api('/collections', { method: 'POST', body: JSON.stringify({ name: this.newCollectionName.trim() }) })
            this.newCollectionName = ''
            await this.reloadCollections()
          })
        },
        async createDoc() {
          await this.run(async () => {
            const doc = await api('/docs', {
              method: 'POST',
              body: JSON.stringify({
                title: this.newDocTitle.trim(),
                content: '',
                collection_id: this.selected.id,
              }),
            })
            location.href = `/doc?id=${doc.id}`
          })
        },
        async search() {
          await this.run(async () => {
            this.hits = await api(`/search?q=${encodeURIComponent(this.query.trim())}`)
          })
        },
      },
      async mounted() {
        await this.run(() => this.reloadCollections())
      },
    }).mount('#app')
  </script>
</body>
</html>
