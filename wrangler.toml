name = "context-mixer"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "context-mixer-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "context-mixer-files"

# MCP OAuth (workers-oauth-provider) grant/token store. Local dev (miniflare)
# emulates KV regardless of id; production needs a real namespace id:
#   npx wrangler kv namespace create OAUTH_KV  → paste the returned id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_PRODUCTION_KV_ID"

[vars]
CLERK_PUBLISHABLE_KEY = "pk_test_d2VsY29tZWQta2l0dGVuLTc0LmNsZXJrLmFjY291bnRzLmRldiQ"
CLERK_FRONTEND_API = "https://welcomed-kitten-74.clerk.accounts.dev"
CLERK_SIGN_IN_URL = "https://welcomed-kitten-74.accounts.dev/sign-in"

# CLERK_SECRET_KEY:
#   local      -> .dev.vars
#   production -> npx wrangler secret put CLERK_SECRET_KEY
