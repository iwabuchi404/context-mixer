name = "context-mixer"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "context-mixer-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "context-mixer-files"

[vars]
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuZmxvZzQwNC53b3JrJA"
CLERK_FRONTEND_API = "https://clerk.flog404.work"
CLERK_SIGN_IN_URL = "https://accounts.flog404.work/sign-in"

# OAuth Configuration for MCP
OAUTH_CLIENT_ID = "context-mixer-mcp"
# OAUTH_CLIENT_SECRET:
#   local      -> .dev.vars
#   production -> npx wrangler secret put OAUTH_CLIENT_SECRET

# CLERK_SECRET_KEY:
#   local      -> .dev.vars
#   production -> npx wrangler secret put CLERK_SECRET_KEY
